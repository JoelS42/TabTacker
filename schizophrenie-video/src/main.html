<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Die Entstehung von Schizophrenie</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="bar">
    <div class="group">
      <button id="play">▶ Play</button>
      <button id="restart">↺ Neustart</button>
      <span id="time">0:00.0</span>
      <span id="scene"></span>
    </div>
    <div class="group toggles">
      <button id="tVoice">Voiceover</button>
      <button id="tMusic">Musik</button>
      <button id="tSubs">Untertitel</button>
      <button id="tDebug" class="off">Debug</button>
    </div>
  </header>
  <main id="wrap">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </main>
  <footer id="timeline">
    <div id="markers"></div>
    <input id="scrub" type="range" min="0" max="100" step="0.01" value="0" aria-label="Zeitleiste" />
  </footer>
  <audio id="voice" src="../audio/narration.mp3" preload="auto"></audio>
  <audio id="music" src="../audio/music.mp3" preload="auto"></audio>
  <audio id="sfx" src="../audio/sfx.mp3" preload="auto"></audio>
  <script src="../data/timings.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
